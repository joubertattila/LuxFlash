; LuxFlash - app build config.
;
; Based on WiFlash's app/platformio.ini (see doc/LuxFlash_terv.md) - the
; same core/board/platform combination, because it's the same hardware
; (RP2040 Pico W-2023 clone, ESP8285 AT modem). There is no extra
; lib_deps entry here - see the note below on why an earlier attempt to
; add WiFiEspAT for the light-sensor server was abandoned.
;
; We use the earlephilhower arduino-pico core (not the official mbed-based
; Arduino core) - this requires Max Gerhardt's community platform fork
; instead of the official PlatformIO "raspberrypi" platform, which
; supports both cores (mbed + earlephilhower) via the
; board_build.core=earlephilhower choice.
;
; IMPORTANT: we do NOT build our own A/B bootloader.
; The earlephilhower core automatically links its own, ready-made
; OTA bootloader (lib/<chip>/ota.o - source: the framework-arduinopico
; package's "ota/" folder) into every build, which on boot checks whether
; there's an update file to apply on LittleFS, and if not, simply starts
; the sketch. We only need to handle DOWNLOADING the update and writing it
; to LittleFS (the Update/HTTPUpdate class + our own, AT-command-based
; Client subclass for the ESP8285) - checksum verification, the flash
; write, and power-loss protection are already done and tested in the
; core.
;
; filesystem_size: needed on LittleFS to temporarily store the downloaded
; firmware .bin BEFORE the OTA bootloader applies it, AND to persist the
; version marker (current.md5). 512 KB is plenty. Adjust as needed.
;
; The WiFi SSID/password lives in a SEPARATE file (wifi_secrets.ini) - see
; the comment there. If this file is missing, the build stops at
; WiFlashApp.cpp's #error lines, rather than silently running with a stale
; default.
;
; IMPORTANT, DISCOVERED BY ACTUALLY BUILDING (see doc/LuxFlash_terv.md's
; "FONTOS FELFEDEZES build kozben" / "important discovery during the
; build" section): there is NO lib_deps/WiFiEspAT here - the light-sensor
; server was originally going to use it (following the pattern of the
; old WFLink_test.ino), but it LINKER-CONFLICTS with the framework's own
; WiFiClient, which WiFlash's own Esp8285Client also uses (both define
; the SAME global WiFiClient class). The server capability is instead
; provided by our own, new Esp8285Server.h/.cpp, built on the SAME
; Esp8285WiFi AT layer that WiFlash's own OTA part uses - see main.cpp.
[platformio]
extra_configs =
    wifi_secrets.ini

[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = pico
framework = arduino
board_build.core = earlephilhower
board_build.filesystem_size = 512k
